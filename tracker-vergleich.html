<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>DETAR — Tracker-Vergleich (QR)</title>
  <!-- QR-Codes für den Gerätevergleich der Tracker-Varianten (Build 93,
       2026-10-12): 8roh (Nulllinie) · alt (PoseStabilizer) · neu (tracker.js),
       seit Build 105 auch 8lerp (8roh + Lerp/Slerp + Schiedsrichter),
       je mit ?stats. Die Links zeigen auf DIESE Auslieferung (Ordner dieser
       Seite) — auf dem Testlink also auf den Testlink, über einen Tunnel auf
       den Tunnel. Karte per ?k=<id> wählbar (Standard 000). QR-Codes aus
       vendor/qrcode/qrcode.js (MIT) wie in karten.html, kein CDN. -->
  <style>
    body { margin: 0; padding: 24px 16px; font: 16px/1.4 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; background: #171717; color: #f6f6f6; }
    h1 { font-size: 22px; margin: 0 0 4px; }
    p.hinweis { margin: 0 0 20px; color: #b5b5b5; font-size: 14px; }
    .karte { display: flex; gap: 10px; align-items: center; margin-bottom: 20px; }
    .karte input { font: inherit; padding: 6px 10px; width: 90px; border-radius: 6px; border: 1px solid #555; background: #222; color: #fff; }
    .karte button { font: inherit; padding: 6px 12px; border-radius: 6px; border: none; background: #3aa1cd; color: #fff; cursor: pointer; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 20px; }
    .box { background: #fff; color: #171717; border-radius: 12px; padding: 16px; text-align: center; }
    .box h2 { margin: 0 0 4px; font-size: 20px; }
    .box .sub { color: #555; font-size: 13px; min-height: 2.6em; margin-bottom: 8px; }
    .box canvas { width: 100%; max-width: 260px; height: auto; image-rendering: pixelated; }
    .box a { display: block; margin-top: 8px; font-size: 12px; color: #0b95d0; word-break: break-all; }
    .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; margin-bottom: 6px; }
    .tag.roh { background: #3d3d3d; color: #fff; } .tag.alt { background: #0b95d0; color: #fff; } .tag.neu { background: #71ff51; color: #1d3917; } .tag.lerp { background: #fced62; color: #171717; }
  </style>
</head>
<body>
  <h1>Tracker-Vergleich</h1>
  <p class="hinweis">Gleicher Stand, vier Varianten, jeweils mit <code>?stats</code>. Reihenfolge am Gerät: erst Nulllinie, dann alt, dann neu, dann 8lerp — Fälle F0 bis F4, „Messung 10 s", Zeile kopieren.</p>
  <div class="karte">
    <label for="k">Karte</label>
    <input id="k" type="text" value="000" />
    <button id="neu">QR-Codes neu</button>
  </div>
  <div class="grid" id="grid"></div>

  <script src="./vendor/qrcode/qrcode.js"></script>
  <script>
    (function () {
      var VARIANTEN = [
        { name: "8roh", tag: "roh", titel: "8roh — Nulllinie", sub: "Engine 1:1, kein Filter, kein Gyro, bei Verlust sofort weg" },
        { name: "alt",  tag: "alt", titel: "alt — PoseStabilizer", sub: "Standard bis Build 109; Zapworks-Port, Monate Gerätetests" },
        { name: "neu",  tag: "neu", titel: "neu — tracker.js", sub: "messgetrieben; Ausreißer halten, Gyro-Brücke, kein Snap beim Anfahren" },
        { name: "8lerp", tag: "lerp", titel: "8lerp — roh + Lerp", sub: "Standard seit Build 110; 8roh + Lerp/Slerp auf die letzte Messung + Schiedsrichter" },
      ];
      var basis = location.href.replace(/[?#].*$/, "").replace(/[^/]*$/, "") + "index.html";
      var grid = document.getElementById("grid");
      var kInput = document.getElementById("k");
      var params = new URLSearchParams(location.search);
      if (params.get("k")) kInput.value = params.get("k");

      function drawQr(canvas, text) {
        var qr = qrcode(0, "M");
        qr.addData(text);
        qr.make();
        var n = qr.getModuleCount(), quiet = 4, cell = 6;
        var size = (n + 2 * quiet) * cell;
        canvas.width = size; canvas.height = size;
        var ctx = canvas.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, size, size);
        ctx.fillStyle = "#000";
        for (var r = 0; r < n; r++) for (var c = 0; c < n; c++) {
          if (qr.isDark(r, c)) ctx.fillRect((c + quiet) * cell, (r + quiet) * cell, cell, cell);
        }
      }

      function render() {
        grid.innerHTML = "";
        var k = (kInput.value || "000").trim();
        VARIANTEN.forEach(function (v) {
          var url = basis + "?k=" + encodeURIComponent(k) + "&stats&tracker=" + v.name; // immer explizit (Standard wechselt, Build 110)
          var box = document.createElement("div");
          box.className = "box";
          box.innerHTML = '<span class="tag ' + v.tag + '">' + v.name + '</span><h2>' + v.titel + '</h2><div class="sub">' + v.sub + '</div>';
          var canvas = document.createElement("canvas");
          drawQr(canvas, url);
          box.appendChild(canvas);
          var a = document.createElement("a");
          a.href = url; a.textContent = url;
          box.appendChild(a);
          grid.appendChild(box);
        });
      }
      document.getElementById("neu").onclick = render;
      kInput.addEventListener("change", render);
      render();
    })();
  </script>
</body>
</html>
